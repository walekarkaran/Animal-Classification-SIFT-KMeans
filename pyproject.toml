[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-bovw"
version = "1.0.0"
description = "Animal image classification with SIFT features and a K-Means Bag-of-Visual-Words encoding"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Karan Walekar" }]
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.5",
    "numpy",
    "scikit-learn>=1.2",
    "pandas",
    "matplotlib",
    "joblib",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["notebooks"]
